# THIEF peer -- PRIVATE local configuration (never signed, never shared).
# Anything both sides must agree on lives ONLY in the shared config/game.json.
version = "0.1"

[game]
group_name = "moamteam"
group_id = "moamteam"
sub_game_number = 1
members = ["STUDENT-ID-1", "STUDENT-ID-2"]          # TODO: fill real student IDs
repos = { cop = "https://github.com/J0kErF/moamteam-police", thief = "https://github.com/J0kErF/moamteam-thief" }

[belief]
smell_trust_weight = 4.0

# [strategy]  -- our brain classes land here in Stage 3 (PRD-03)
# thief_class = "moamteam.strategy.brains:MoamThiefBrain"

# [trash_talk] -- verbal-layer provider (Stage 4, PRD-04). Default: template (0 tokens).
# provider = "template"

[paths]
logs_dir = "logs"
log_filename = "{role}_match.json"

[play]
