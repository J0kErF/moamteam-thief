[network]
my_port = 8801
opponent_url = "http://127.0.0.1:8802/mcp"
turn_timeout_seconds = 180
# opponent_bearer_token = ""   # set (in members.local.toml) if the rival's tunnel requires Authorization: Bearer

[email]
recipient = "rmisegal+uoh26finalgame@gmail.com"
enabled = false                     # flip to true for counted league games ONLY
# OAuth material lives OUTSIDE the repo tree (never committed; rule #39/#40).
credentials_path = "C:/Users/moham/secrets/moamteam-google/credentials.json"
