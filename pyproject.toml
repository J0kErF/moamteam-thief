[project]
name = "moamteam-p2p"
version = "0.1.0"
description = "moamteam final project: distributed Cops-and-Robbers between AI agents over a P2P network (FastMCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.3",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.0",
    "google-auth-oauthlib>=1.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pillow>=12.3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moamteam"]

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 (StrEnum) is deliberately off: swapping `str, Enum` for StrEnum changes
# str()/f-string output of every member ("Role.POLICE" -> "police"), a silent
# wire- and log-format risk for zero functional gain.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true      # fastmcp / google client stubs are unavailable
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: pure-domain unit tests",
    "integration: multi-component tests",
    "slow: slow-running tests",
]
